# The core loop on a real build: signed in -> Today -> study 5 cards (going
# offline mid-session on Android) -> celebration. verify-reviews.mjs then
# checks the server received exactly those 5 reviews.
#
# iOS signs in through the clipboard-adopt hook (src/e2e/ClipboardAdopt.tsx):
# the workflow plants bonamind://e2e/session?rt=… on the simulator clipboard
# (xcrun simctl pbcopy) and the app adopts it on the welcome screen. openLink
# cannot sign iOS in: iOS 26 gates cold custom-scheme deep links behind a
# system "Open in 'BonaMind'?" sheet whose Open button drops the URL in CI
# (mobile-dev-inc/Maestro#2610, unfixed). Android has no such sheet, so the
# deep link signs it in directly.
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: true
      # The cold welcome screen adopts the planted clipboard session
      # (src/e2e/ClipboardAdopt.tsx). iOS interposes a paste-permission sheet
      # over it, and a system sheet hides the app's own tree from the
      # snapshot, so wait until "Continue with email" either vanishes
      # (sign-in went through) or is hidden by the sheet, then confirm the
      # sheet if it is indeed up.
      - repeat:
          times: 30
          while:
            visible: "Continue with email"
          commands:
            - waitForAnimationToEnd:
                timeout: 3000
      - tapOn:
          text: "^Allow Paste$"
          optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: bonamind://e2e/session?rt=${RT}
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- takeScreenshot: today
- tapOn: "Start review"
- repeat:
    times: 3
    commands:
      - tapOn: "Tap or swipe to reveal"
      - swipe:
          direction: RIGHT
          duration: 300
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
- repeat:
    times: 2
    commands:
      - tapOn: "Tap or swipe to reveal"
      - swipe:
          direction: RIGHT
          duration: 300
- takeScreenshot: celebration
- assertVisible: "day streak"
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
      - waitForAnimationToEnd:
          timeout: 15000
- tapOn: "Done"
