# The core loop on a real build: signed in -> Today -> study 5 cards (going
# offline mid-session on Android) -> celebration. verify-reviews.mjs then
# checks the server received exactly those 5 reviews.
appId: ${APP_ID}
---
- openLink: bonamind://e2e/session?rt=${RT}
- runFlow:
    when:
      platform: iOS
    commands:
      # iOS 26 parks a system "Open in 'BonaMind'?" sheet on the first deep
      # link, sometimes a few seconds after the call, and nothing happens
      # until it is confirmed. Maestro forbids nested runFlows, so instead of
      # matching the sheet we tap its Open button by position: 68%,54% is the
      # Open button on every iPhone Pro simulator (verified from the dialog's
      # hierarchy dump). Three taps, spaced out, cover slow renders, and they
      # land on empty Today-screen background once the app is already open.
      - runScript:
          script: |
            const end = Date.now() + 6000
            while (Date.now() < end) {}
      - tapOn:
          point: "68%,54%"
      - runScript:
          script: |
            const end = Date.now() + 3000
            while (Date.now() < end) {}
      - tapOn:
          point: "68%,54%"
      - runScript:
          script: |
            const end = Date.now() + 3000
            while (Date.now() < end) {}
      - tapOn:
          point: "68%,54%"
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- takeScreenshot: today
- tapOn: "Start review"
- repeat:
    times: 3
    commands:
      - tapOn: "Tap or swipe to reveal"
      - swipe:
          direction: RIGHT
          duration: 300
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
- repeat:
    times: 2
    commands:
      - tapOn: "Tap or swipe to reveal"
      - swipe:
          direction: RIGHT
          duration: 300
- takeScreenshot: celebration
- assertVisible: "day streak"
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
      - waitForAnimationToEnd:
          timeout: 15000
- tapOn: "Done"
