# The core loop on a real build: signed in -> Today -> study 5 cards (going
# offline mid-session on Android) -> celebration. verify-reviews.mjs then
# checks the server received exactly those 5 reviews.
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: iOS
    commands:
      # iOS 26 gates the first cold deep-link launch behind a system "Open in
      # 'BonaMind'?" sheet whose Open button routinely fails to actually
      # launch the app in CI (mobile-dev-inc/Maestro#2610, unfixed). Launching
      # the app normally warms it up, so openLink routes into an
      # already-running process and the sheet never appears.
      - launchApp:
          clearState: true
- openLink: bonamind://e2e/session?rt=${RT}
- runFlow:
    when:
      platform: iOS
    commands:
      # Belt and braces: if a "Open in 'BonaMind'?" sheet shows up anyway,
      # confirm it; optional keeps this from failing when it does not.
      - tapOn:
          text: "^Open$"
          optional: true
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- takeScreenshot: today
- tapOn: "Start review"
- repeat:
    times: 3
    commands:
      - tapOn: "Tap or swipe to reveal"
      - swipe:
          direction: RIGHT
          duration: 300
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
- repeat:
    times: 2
    commands:
      - tapOn: "Tap or swipe to reveal"
      - swipe:
          direction: RIGHT
          duration: 300
- takeScreenshot: celebration
- assertVisible: "day streak"
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
      - waitForAnimationToEnd:
          timeout: 15000
- tapOn: "Done"
