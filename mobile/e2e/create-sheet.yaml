# The course-creation sheet must open without dying: on a real iPhone (v1.0.0
# release build) tapping a course button towards it killed the whole app with
# a kernel data abort, 4 out of 4 tries. This flow signs in to Today and then
# taps the real Today "Add course" button, which routes to /create exactly
# the way production does. iOS's first parked deep-link opens behind a system
# sheet; see the comment under openLink for the confirm ladder.
appId: ${APP_ID}
---
- openLink: bonamind://e2e/session?rt=${RT}
- runFlow:
    when:
      platform: iOS
    commands:
      # iOS 26 parks a system "Open in 'BonaMind'?" sheet on the first deep
      # link, sometimes a few seconds after the call, and nothing happens
      # until it is confirmed. Maestro forbids nested runFlows, so instead of
      # matching the sheet we tap its Open button by position: 68%,54% is the
      # Open button on every iPhone Pro simulator (verified from the dialog's
      # hierarchy dump). Three taps, spaced out, cover slow renders, and they
      # land on empty Today-screen background once the app is already open.
      - runScript:
          script: |
            const end = Date.now() + 6000
            while (Date.now() < end) {}
      - tapOn:
          point: "68%,54%"
      - runScript:
          script: |
            const end = Date.now() + 3000
            while (Date.now() < end) {}
      - tapOn:
          point: "68%,54%"
      - runScript:
          script: |
            const end = Date.now() + 3000
            while (Date.now() < end) {}
      - tapOn:
          point: "68%,54%"
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- takeScreenshot: before-create
- tapOn: "Add course"
- extendedWaitUntil:
    visible: "Your topic"
    timeout: 15000
- assertVisible: "Make my course"
- takeScreenshot: create-sheet
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Today"
    timeout: 10000
