# The course-creation sheet must open without dying: on a real iPhone (v1.0.0
# release build) tapping a course button towards it killed the whole app with
# a kernel data abort, 4 out of 4 tries. This flow reaches /create exactly the
# way production does: from Today's "Add course" button, or from the Courses
# tab's "New course" button — Today may be all caught up after the core loop,
# which renders no CTA at all.
#
# The e2e build keeps its session in memory only (src/data/supabase.ts), so
# the core loop's sign-in does not survive this relaunch. On iOS the workflow
# mints a fresh session and plants it as the token file, which the welcome
# screen adopts exactly as in the core loop; openLink is unusable on iOS 26
# (Maestro#2610, see core-loop). Android re-adopts the session deep link and
# routes to /create by deep link as well.
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: iOS
    commands:
      # No clearState: it reinstalls the app on iOS and would delete the
      # freshly planted token file (see core-loop).
      - launchApp
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: bonamind://e2e/session?rt=${RT}
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- takeScreenshot: before-create
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Courses"
      - tapOn: "New course"
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: bonamind://create
- extendedWaitUntil:
    visible: "Your topic"
    timeout: 15000
- assertVisible: "Make my course"
- takeScreenshot: create-sheet
- tapOn: "Close"
- runFlow:
    when:
      platform: iOS
    commands:
      # Close routes back to the Courses tab the sheet was pushed from.
      - extendedWaitUntil:
          visible: "Classes"
          timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Today"
          timeout: 10000
