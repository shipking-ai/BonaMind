# The course-creation sheet must open without dying: on a real iPhone (v1.0.0
# release build) tapping a course button towards it killed the whole app with
# a kernel data abort, 4 out of 4 tries. This flow signs in to Today and then
# taps the real Today "Add course" button, which routes to /create exactly
# the way production does. iOS's parked deep-link open is handled by the
# repeat loop; see the comment in the core-loop flow.
appId: ${APP_ID}
---
- openLink: bonamind://e2e/session?rt=${RT}
- runFlow:
    when:
      platform: iOS
    commands:
      # iOS 26 parks a system "Open in 'BonaMind'?" sheet for a few seconds
      # after a deep link, and nothing opens until it is confirmed. Maestro's
      # tree cannot see that sheet, so we tap its Open button by position
      # (68%,54% is the Open button on every iPhone Pro simulator, verified
      # from the dialog's hierarchy dump) and keep spotting it while the app
      # has not reached Today yet. The loop stops once Today is visible.
      - repeat:
          times: 6
          while:
            notVisible: "Today"
          commands:
            - tapOn:
                point: "68%,54%"
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- takeScreenshot: before-create
- tapOn: "Add course"
- extendedWaitUntil:
    visible: "Your topic"
    timeout: 15000
- assertVisible: "Make my course"
- takeScreenshot: create-sheet
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Today"
    timeout: 10000
