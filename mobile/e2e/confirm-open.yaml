# iOS 26 parks a system "Open in 'BonaMind'?" sheet for custom-scheme deep
# links, sometimes a few seconds after the open call, and the app behind it
# stays dead until the sheet is confirmed. Importing flows call this as
#     - runFlow: { when: { platform: iOS }, file: confirm-open.yaml }
# The runScript buys the sheet time to render (when-conditions are evaluated
# once, not polled), the text tap is the fast path, and the point tap is the
# fallback for the case where Maestro's element tree cannot reach system
# sheets; it is guarded by "app not on Today yet" so it never taps the app.
- runScript:
    script: |
      const end = Date.now() + 6000
      while (Date.now() < end) {}
- runFlow:
    when:
      visible: "^Open$"
    commands:
      - tapOn: "^Open$"
- runFlow:
    when:
      notVisible: "Today"
    commands:
      - tapOn:
          point: "68%,54%"
