apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Play burns a versionCode on upload, and a watch build's code must differ
// from every phone build's: the phone and watch bundles share one listing
// (same package name), so they share one versionCode space. CI passes
// WEAR_VERSION_CODE; otherwise it is the phone's code (ANDROID_VERSION_CODE)
// moved past any phone code by a fixed 1,000,000,000. Local builds get 1.
def phoneVersionCode = System.getenv("ANDROID_VERSION_CODE")
def wearVersionCode = Integer.parseInt(
    System.getenv("WEAR_VERSION_CODE")
        ?: (phoneVersionCode ? String.valueOf(1_000_000_000 + Integer.parseInt(phoneVersionCode)) : "1")
)

android {
    namespace = "com.auramind.app.wear"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        // Same package name as the phone app (android/app). The Wearable Data
        // Layer only connects apps whose package name and signing key match,
        // and Play only ships a watch build in the phone app's listing under
        // that name. The Kotlin namespace stays com.auramind.app.wear.
        applicationId "com.auramind.app"
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode wearVersionCode
        versionName "2.3.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Env-driven release signing, mirroring the phone app module. The watch
    // APK is signed with the same production keystore family; credentials
    // come from CI secrets or keystore.env and never enter git.
    signingConfigs {
        release {
            String keystoreRelOrAbs = System.getenv('ANDROID_KEYSTORE_PATH')
                ?: 'android/keystore/release.keystore'
            File keystoreFile = keystoreRelOrAbs.length() > 0 && (keystoreRelOrAbs.charAt(0) == '/' || keystoreRelOrAbs.charAt(1) == ':')
                ? new File(keystoreRelOrAbs)
                : new File(rootProject.projectDir.parentFile, keystoreRelOrAbs)
            String ksStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            String ksKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: 'auramind-upload'
            String ksKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: ksStorePassword
            if (keystoreFile.exists() && ksStorePassword) {
                storeFile keystoreFile
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            } else {
                boolean isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
                if (isReleaseTask) {
                    throw new GradleException(
                        "[BonaMind:wear] Release build cannot proceed. Required inputs missing:\n" +
                        "  • keystore: ${keystoreFile.absolutePath} ${keystoreFile.exists() ? '(found)' : '(NOT FOUND)'}\n" +
                        "  • ANDROID_KEYSTORE_PASSWORD env var ${ksStorePassword ? '(set)' : '(NOT SET)'}\n" +
                        "Use the same credentials as the phone app: see android/keystore/README.md\n" +
                        "For a compile-only check use ./gradlew :wear:assembleDebug."
                    )
                }
            }
        }
    }

    buildTypes {
        // Matches the phone app's debug suffix, so a debug watch build pairs
        // with a debug phone build (com.auramind.app.debug on both).
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "androidx.wear:wear:1.3.0"
    implementation "androidx.wear.compose:compose-material:1.5.2"
    implementation "androidx.wear.compose:compose-foundation:1.5.2"
    implementation "androidx.compose.ui:ui:1.7.6"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "com.google.android.gms:play-services-wearable:18.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "androidx.wear.tiles:tiles:1.5.0"
    implementation "androidx.wear.tiles:tiles-renderer:1.5.0"
    implementation "com.google.guava:guava:33.2.0-jre"
    implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1"
    testImplementation "junit:junit:4.13.2"
    // End-to-end review test on a Wear OS emulator (src/androidTest). Same
    // version as the androidx.compose.ui the wear-compose libraries resolve to.
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.8.2"
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.8.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    // Real org.json for local unit tests (android.jar stubs throw "not mocked")
    testImplementation "org.json:json:20240303"
}