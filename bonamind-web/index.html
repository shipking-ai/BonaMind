<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- data-brand tags below are rewritten at build time by
         vite-plugins/brand-html.ts from app-identity.ts. Do not type the
         product name into them by hand — edit app-identity.ts instead.
         The build fails if one of these attributes goes missing. -->
    <title data-brand="title">BonaMind - Your AI Learning System</title>
    <meta data-brand="description" name="description" content="BonaMind turns any PDF, video, or topic into a personalized course — AI flashcards, quizzes, FSRS v5 spaced repetition, and a tutor that remembers exactly what you struggle with." />
    <meta data-brand="author" name="author" content="BonaMind" />
    <!-- Must stay the first script: moves pre-rename storage keys before any
         module can read them (see public/storage-migrate.js). -->
    <script src="/storage-migrate.js"></script>
    <script src="/platform-detect.js"></script>
    <link rel="stylesheet" href="/src/index.css">
    <!-- Favicons & Logos -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicons,logos/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons,logos/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons,logos/favicon-16.png" />
    <link rel="icon" type="image/x-icon" href="/favicons,logos/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons,logos/apple-touch-icon.png" />
    <!-- The web app manifest is injected by vite-plugin-pwa at build time
         (manifest.webmanifest) — keep a single manifest source. -->
    <meta name="theme-color" content="#3247E8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta data-brand="og:title" property="og:title" content="BonaMind - Your AI Learning System" />
    <meta property="og:description" content="Turn anything into a course. BonaMind builds your cards and quizzes, schedules reviews with FSRS v5, and remembers what you struggle with." />
    <meta property="og:image" content="/favicons,logos/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta data-brand="twitter:title" name="twitter:title" content="BonaMind - Your AI Learning System" />
    <meta name="twitter:description" content="Turn any PDF, video, or topic into a personalized course with AI flashcards, quizzes, and a tutor that remembers you." />
    <meta name="twitter:image" content="/favicons,logos/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
