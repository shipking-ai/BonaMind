<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="elite-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="55%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="elite-halo" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#EC4899" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#09090B"/>
  <circle cx="32" cy="32" r="30" fill="url(#elite-halo)"/>

  <!-- Orbit dots -->
  <circle cx="9"  cy="14" r="0.8" fill="#A78BFA"/>
  <circle cx="56" cy="22" r="0.9" fill="#67E8F9"/>
  <circle cx="56" cy="46" r="1.0" fill="#EC4899"/>
  <circle cx="9"  cy="50" r="0.9" fill="#A78BFA"/>

  <!-- Fuller profile -->
  <path d="M14,18 L20,12 L28,10 L36,12 L44,16 L50,22 L54,30 L54,38 L50,44 L46,48 L44,52 L38,56 L30,56 L22,54 L16,48 L12,40 L12,28 Z"
        stroke="url(#elite-stroke)" stroke-width="2" fill="none" stroke-linejoin="round"/>

  <circle cx="20" cy="12" r="1.5" fill="#A78BFA"/>
  <circle cx="36" cy="12" r="1.4" fill="#67E8F9"/>
  <circle cx="50" cy="22" r="1.4" fill="#EC4899"/>
  <!-- Eye = solid white, with brighter halo. -->
  <circle cx="52" cy="28" r="2.2" fill="#F0EFFE"/>
  <circle cx="52" cy="28" r="5" fill="none" stroke="#A78BFA" stroke-opacity="0.55" stroke-width="0.8"/>
  <circle cx="40" cy="46" r="1.6" fill="#EC4899"/>
  <circle cx="22" cy="54" r="1.5" fill="#A78BFA"/>
  <circle cx="12" cy="40" r="1.4" fill="#67E8F9"/>
  <text x="32" y="62" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#A78BFA">30+</text>
</svg>
