<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="geometricPrecision" role="img" aria-labelledby="prism-title prism-description">
  <title id="prism-title">Prof. Linnea</title>
  <desc id="prism-description">A faceted open diamond aperture with a luminous central core.</desc>
  <defs>
    <linearGradient id="prism-mark" x1="112" y1="394" x2="406" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72F4FF" />
      <stop offset="0.38" stop-color="#8E89FF" />
      <stop offset="0.68" stop-color="#D38BFF" />
      <stop offset="1" stop-color="#FF9ACD" />
    </linearGradient>
    <radialGradient id="prism-core" cx="32%" cy="24%" r="80%">
      <stop stop-color="#FFFFFF" />
      <stop offset="0.52" stop-color="#F1FEFF" />
      <stop offset="1" stop-color="#8CEBFF" />
    </radialGradient>
    <radialGradient id="prism-glow" cx="50%" cy="50%" r="58%">
      <stop stop-color="#D38BFF" stop-opacity="0.24" />
      <stop offset="0.62" stop-color="#7C3AED" stop-opacity="0.08" />
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <filter id="prism-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="17" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="204" fill="url(#prism-glow)" filter="url(#prism-blur)" />

  <!-- The Prism Aperture: a single faceted silhouette with a focused center. -->
  <path d="M256 79L424 256L256 433L88 256Z" fill="none" stroke="url(#prism-mark)" stroke-width="56" stroke-linejoin="round" stroke-linecap="round" opacity="0.2" filter="url(#prism-blur)" />
  <path d="M256 79L424 256L256 433L88 256Z" fill="none" stroke="url(#prism-mark)" stroke-width="56" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M256 151L357 256L256 361L155 256Z" fill="none" stroke="url(#prism-mark)" stroke-width="23" stroke-linejoin="round" stroke-linecap="round" />

  <!-- The bright core is the only internal detail, keeping the mark crisp at 16px. -->
  <circle cx="256" cy="256" r="28" fill="url(#prism-core)" />
  <circle cx="248" cy="248" r="7" fill="#FFFFFF" opacity="0.9" />
</svg>
