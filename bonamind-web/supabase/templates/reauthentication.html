<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Confirm it&#x27;s you - BonaMind</title>
</head>
<body style="margin:0;padding:0;background:#F4F4F7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F4F7;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border-radius:12px;">
        <tr>
          <td style="padding:32px 32px 8px 32px;font-family:Arial,Helvetica,sans-serif;">
            <p style="margin:0 0 24px 0;font-size:20px;font-weight:bold;color:#7C3AED;">BonaMind</p>
            <h1 style="margin:0 0 16px 0;font-size:22px;font-weight:bold;color:#1A1A24;">Confirm it’s you</h1>
            <p style="margin:0 0 16px 0;font-size:16px;line-height:24px;color:#1A1A24;">Enter this code in BonaMind to continue. It expires in 1 hour.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 32px 16px 32px;font-family:Arial,Helvetica,sans-serif;">
            <p style="margin:0;font-size:32px;font-weight:bold;letter-spacing:6px;color:#1A1A24;">{{ .Token }}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 32px 32px 32px;font-family:Arial,Helvetica,sans-serif;">
            <p style="margin:0;font-size:14px;line-height:22px;color:#55556A;">Didn’t ask for this? You can ignore this email, but consider changing your password.</p>
          </td>
        </tr>
      </table>
      <p style="margin:16px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#8A8AA3;">
        BonaMind &middot; <a href="https://bonamind.app" style="color:#8A8AA3;">bonamind.app</a>
      </p>
    </td>
  </tr>
</table>
</body>
</html>
