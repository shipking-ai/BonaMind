apply plugin: 'com.android.application'

// Play permanently burns a versionCode on upload — it can never be reused,
// even if the release is deleted. A hardcoded value therefore works exactly
// once: every later upload is rejected with "Version code N has already been
// used" until someone hand-edits this file. CI supplies a monotonically
// increasing run number instead; local builds fall back to 1.
//
// Computed here rather than inline in defaultConfig: Groovy parses
// `versionCode (expr).toInteger()` as `versionCode(expr).toInteger()`, which
// passes a String to the DSL and fails at configuration time.
def ciVersionCode = Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "1")

android {
    namespace = "com.auramind.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.auramind.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ciVersionCode
        versionName "2.3.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    /**
     * signingConfigs.release — strictly env-driven.
     *
     * The release keystore + passwords never enter git. They come from CI/CD
     * secrets or a developer's password manager via these env vars:
     *   ANDROID_KEYSTORE_PATH       (path to release.keystore)
     *   ANDROID_KEYSTORE_PASSWORD   (keystore store password)
     *   ANDROID_KEY_ALIAS           (key alias, default: auramind-upload)
     *   ANDROID_KEY_PASSWORD        (key password, default: keystore password)
     *
     * Loud-fail on release: if any required input is missing while building
     * the `release` type, Gradle fails with a clear message instead of
     * silently signing with the debug cert (which Play Store rejects).
     */
    signingConfigs {
        release {
            String keystoreRelOrAbs = System.getenv('ANDROID_KEYSTORE_PATH')
                ?: 'android/keystore/release.keystore'
            File keystoreFile = keystoreRelOrAbs.length() > 0 && (keystoreRelOrAbs.charAt(0) == '/' || keystoreRelOrAbs.charAt(1) == ':')
                ? new File(keystoreRelOrAbs)  // absolute path
                : new File(rootProject.projectDir.parentFile, keystoreRelOrAbs)  // relative to repo root
            String ksStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            String ksKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: 'auramind-upload'
            String ksKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: ksStorePassword
            if (keystoreFile.exists() && ksStorePassword) {
                storeFile keystoreFile
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            } else {
                // If we're missing credentials, only fail the build if we're actually
                // running a release task. This prevents IDE sync from failing.
                boolean isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
                if (isReleaseTask) {
                    throw new GradleException(
                        "[BonaMind] Release build cannot proceed. Required inputs missing:\n" +
                        "  • keystore: ${keystoreFile.absolutePath} ${keystoreFile.exists() ? '(found)' : '(NOT FOUND)'}\n" +
                        "  • ANDROID_KEYSTORE_PASSWORD env var ${ksStorePassword ? '(set)' : '(NOT SET)'}\n" +
                        "  • ANDROID_KEY_ALIAS env var (defaults to 'auramind-upload' if unset)\n" +
                        "  • ANDROID_KEY_PASSWORD env var (defaults to keystore password if unset)\n" +
                        "Generate a release keystore: see android/keystore/README.md\n" +
                        "Then re-run with all four env vars set.\n" +
                        "If you intended to build a debug APK instead, use ./gradlew assembleDebug."
                    )
                }
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // EdgeToEdge.enable() for MainActivity (explicit: Capacitor also ships it,
    // but the window call must resolve against a known version at compile time)
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Wear OS data layer — used by the WearSync plugin (watch companion sync)
    implementation "com.google.android.gms:play-services-wearable:18.1.0"
    // System biometric sheet (BiometricAuthPlugin) + Keystore-backed vault
    implementation "androidx.biometric:biometric:1.1.0"
    // 1.1.0-alpha06: the 1.0.0 line has only the deprecated MasterKeys API;
    // the MasterKey builder used by the credential vault arrived in 1.1.0.
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    // In-app review + flexible updates (PlayEngagementPlugin)
    implementation "com.google.android.play:review:2.0.1"
    implementation "com.google.android.play:app-update:2.1.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
