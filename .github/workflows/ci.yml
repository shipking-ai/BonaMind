name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]   # 20 is EOL (2026-04); jsdom 30 needs >= 22.19

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: bonamind-web/package-lock.json

      # No dependencies needed: plain Node over `git ls-files`. Runs in the
      # required job so an old brand name can't merge (see HANDOFF, "The
      # brand guard").
      - name: Brand guard
        run: |
          node --test scripts/check-brand.test.mjs
          node scripts/check-brand.mjs

      - name: Install dependencies
        run: |
          cd bonamind-web
          npm ci

      - name: Run type check
        run: |
          cd bonamind-web
          npm run type-check

      - name: Run tests
        run: |
          cd bonamind-web
          npm test -- --run

      - name: Install API dependencies
        run: |
          cd api
          npm ci

      - name: API type check
        run: |
          cd api
          npx tsc --noEmit

      - name: Run API tests
        run: |
          cd api
          npm test

      - name: Check native shells match app-identity.ts
        run: |
          cd bonamind-web
          node scripts/brand-sync.mjs

      - name: Build project
        run: |
          cd bonamind-web
          npm run build

      - name: Check initial-load bundle size
        run: |
          cd bonamind-web
          node scripts/check-bundle-size.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.node-version }}
          path: bonamind-web/dist
          retention-days: 7

  core:
    # @bonamind/core is shared by the website and the native app; a change
    # here re-tests both consumers' contract (types, FSRS goldens, sync).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: packages/core/package-lock.json
      - name: Install core dependencies
        run: |
          cd packages/core
          npm ci
      - name: Core type check
        run: |
          cd packages/core
          npm run type-check
      - name: Core tests
        run: |
          cd packages/core
          npm test

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: bonamind-web/package-lock.json

      - name: Install dependencies
        run: |
          cd bonamind-web
          npm ci

      - name: Install Playwright browsers
        run: |
          cd bonamind-web
          npx playwright install --with-deps chromium

      # The seeded specs mint throwaway accounts, so they run against a
      # Supabase started on this runner, never the live project: the
      # baseline schema plus every migration, then the API on 3002.
      - name: Start a local Supabase
        run: |
          mkdir -p "$RUNNER_TEMP/supabase-e2e" && cd "$RUNNER_TEMP/supabase-e2e"
          npx -y supabase@2.109.1 init
          sed -i 's/^project_id = .*/project_id = "bonamind-e2e"/' supabase/config.toml
          npx -y supabase@2.109.1 start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,storage-api,postgres-meta
          npx -y supabase@2.109.1 status -o env > status.env
          # Local-only demo keys, but keep them out of the log anyway.
          set -a; . ./status.env; set +a
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "VITE_API_PROXY_TARGET=http://localhost:3002"
            echo "E2E_REQUIRE_SEED=1"
          } >> "$GITHUB_ENV"

      - name: Build the BonaMind schema in it
        run: node bonamind-web/scripts/e2e-local-db.mjs

      - name: Start the API on 3002
        run: |
          cd api
          npm ci
          # Unused placeholders: the server refuses to boot without them.
          RESEND_API_KEY=re_e2e_unused STRIPE_SECRET_KEY=sk_test_e2e_unused PORT=3002 \
            nohup npx tsx server.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3002/api/health >/dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Run Playwright e2e
        run: |
          cd bonamind-web
          npx playwright test

      - name: A watch grade reaches the database
        run: |
          cd bonamind-web
          npx vitest --run src/__tests__/watchGradeToServer.test.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: bonamind-web/test-results
          retention-days: 7

  android-build:
    # Smoke check that the Capacitor Android project still compiles. Runs on
    # every push/PR so a breakage in the mobile web bundle or native shell is
    # caught immediately — the full signed-release + Play upload pipeline lives
    # in mobile-android.yml (tag/manual gated, needs store secrets).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: bonamind-web/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: |
          cd bonamind-web
          npm ci

      - name: Build mobile web bundle + sync Capacitor
        run: |
          cd bonamind-web
          npm run build:android

      - name: Compile debug APK + unit tests (no release secrets required)
        run: |
          cd bonamind-web/android
          ./gradlew assembleDebug :app:testDebugUnitTest

      - name: Compile Wear OS app + unit tests
        run: |
          cd bonamind-web/android
          ./gradlew :wear:testDebugUnitTest :wear:assembleDebug