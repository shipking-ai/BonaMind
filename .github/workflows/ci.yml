name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]   # 20 is EOL (2026-04); jsdom 30 needs >= 22.19

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: bonamind-web/package-lock.json

      # No dependencies needed: plain Node over `git ls-files`. Runs in the
      # required job so an old brand name can't merge (see HANDOFF, "The
      # brand guard").
      - name: Brand guard
        run: |
          node --test scripts/check-brand.test.mjs
          node scripts/check-brand.mjs

      - name: Install dependencies
        run: |
          cd bonamind-web
          npm ci

      - name: Run type check
        run: |
          cd bonamind-web
          npm run type-check

      - name: Run tests
        run: |
          cd bonamind-web
          npm test -- --run

      - name: Install API dependencies
        run: |
          cd api
          npm ci

      - name: API type check
        run: |
          cd api
          npx tsc --noEmit

      - name: Run API tests
        run: |
          cd api
          npm test

      - name: Check native shells match app-identity.ts
        run: |
          cd bonamind-web
          node scripts/brand-sync.mjs

      - name: Build project
        run: |
          cd bonamind-web
          npm run build

      - name: Check initial-load bundle size
        run: |
          cd bonamind-web
          node scripts/check-bundle-size.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.node-version }}
          path: bonamind-web/dist
          retention-days: 7

  core:
    # @bonamind/core is shared by the website and the native app; a change
    # here re-tests both consumers' contract (types, FSRS goldens, sync).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: packages/core/package-lock.json
      - name: Install core dependencies
        run: |
          cd packages/core
          npm ci
      - name: Core type check
        run: |
          cd packages/core
          npm run type-check
      - name: Core tests
        run: |
          cd packages/core
          npm test

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: bonamind-web/package-lock.json

      - name: Install dependencies
        run: |
          cd bonamind-web
          npm ci

      - name: Install Playwright browsers
        run: |
          cd bonamind-web
          npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: |
          cd bonamind-web
          npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: bonamind-web/test-results
          retention-days: 7

  android-build:
    # Smoke check that the Capacitor Android project still compiles. Runs on
    # every push/PR so a breakage in the mobile web bundle or native shell is
    # caught immediately — the full signed-release + Play upload pipeline lives
    # in mobile-android.yml (tag/manual gated, needs store secrets).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: bonamind-web/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: |
          cd bonamind-web
          npm ci

      - name: Build mobile web bundle + sync Capacitor
        run: |
          cd bonamind-web
          npm run build:android

      - name: Compile debug APK + unit tests (no release secrets required)
        run: |
          cd bonamind-web/android
          ./gradlew assembleDebug :app:testDebugUnitTest

      - name: Compile Wear OS app + unit tests
        run: |
          cd bonamind-web/android
          ./gradlew :wear:testDebugUnitTest :wear:assembleDebug