name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time. A newer push waits for the running one
# instead of racing it, and replaces any older run still waiting, so the
# newest commit is always the last to go live. Vercel's Git integration is
# off for main (vercel.json "git"), so this is the only production deploy.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: bonamind-web/package-lock.json

      - name: Install dependencies
        run: |
          cd bonamind-web
          npm ci

      - name: Build project
        run: |
          cd bonamind-web
          npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # The Vercel project is rooted at the repo root (rootDirectory ".") so the
      # api/ serverless functions are deployed alongside the frontend. Run all
      # vercel steps from the repo root and link to the existing project
      # explicitly (`.vercel/` is gitignored, so there is no link in CI).
      - name: Link to Vercel project
        run: vercel link --yes --project=auramind-gemini --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}