name: Wear OS

# End-to-end test of the watch app on a Wear OS emulator
# (bonamind-web/android/wear/src/androidTest): load the debug sample deck,
# review every card, and check each grade is waiting on the data layer for
# the phone as its own item. Unit tests and the debug build stay in ci.yml's
# Android job.
#
# Needs no secrets and touches no server: nothing is paired, so the grades
# stay on the emulator.

on:
  pull_request:
    paths:
      - 'bonamind-web/android/wear/**'
      - 'bonamind-web/android/app/src/main/java/com/auramind/app/WearSync*'
      - '.github/workflows/wear.yml'
  push:
    branches: [main]
    paths:
      - 'bonamind-web/android/wear/**'
      - 'bonamind-web/android/app/src/main/java/com/auramind/app/WearSync*'
      - '.github/workflows/wear.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wear-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wear-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: bonamind-web/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # The Gradle build includes the Capacitor modules from node_modules and
      # the generated Cordova plugin project. `cap update` generates those
      # without building the web app, which the watch does not use.
      - name: Install npm dependencies and generate the Capacitor projects
        working-directory: bonamind-web
        run: |
          npm ci
          mkdir -p android/app/src/main/assets
          npx cap update android

      - name: Build the app and test APKs
        working-directory: bonamind-web/android
        run: ./gradlew --no-daemon :wear:assembleDebug :wear:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Review the sample deck on a Wear OS emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          disable-animations: true
          script: cd bonamind-web/android && ./gradlew --no-daemon :wear:connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wear-e2e
          path: |
            bonamind-web/android/wear/build/reports/androidTests
            bonamind-web/android/wear/build/outputs/androidTest-results
          if-no-files-found: ignore
