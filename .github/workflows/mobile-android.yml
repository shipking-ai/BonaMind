name: Mobile Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        # Play track names as the Publishing API expects them:
        #   internal   - Internal testing (up to 100 testers, instant)
        #   alpha      - CLOSED testing. The only track that counts toward the
        #                12-testers-for-14-continuous-days requirement that
        #                gates production access for personal developer
        #                accounts created after 2023-11-13.
        #   beta       - Open testing (public opt-in)
        #   production - Live on the Play Store
        description: 'Play track (internal | alpha=closed | beta=open | production)'
        required: true
        type: choice
        default: 'internal'
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        # Play refuses any other status while the app is still a "draft app",
        # i.e. until its first release has been published from the console:
        #   "Only releases with status draft may be created on draft app."
        # That is exactly how the 2026-09-09 run failed -- the bundle built,
        # signed and uploaded fine, and only the final commit was rejected.
        #
        # Leave this on draft until one release has been published by hand;
        # after that, completed makes a dispatch go live on its track.
        description: 'Release status (draft until the first release is published)'
        required: true
        type: choice
        default: 'draft'
        options:
          - draft
          - completed

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    defaults:
      run:
        working-directory: bonamind-web

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Capacitor CLI 8.x hard-requires Node >= 22 and exits fatally on 20,
          # after the Vite build has already succeeded — so the failure looked
          # like a web build problem rather than a runner version one. ci.yml's
          # android-build job already uses 22.x; this keeps them aligned.
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: bonamind-web/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # The web build reads VITE_* values from .env (gitignored). CI injects
      # them from repo secrets; `.env.mobile` (committed) supplies the
      # production API/SSE/translation endpoints for the Capacitor build.
      - name: Write build env from secrets
        # Secrets arrive as real environment variables rather than being
        # interpolated into the script body. The previous version substituted
        # ${{ }} straight into a quoted heredoc and then tested "$VITE_SUPABASE_URL"
        # as a SHELL variable that was never exported — under `set -u` that
        # aborted the step every time, whether or not the secrets existed.
        # Passing them through `env:` also keeps secret values out of the
        # rendered script, so they cannot break quoting or be injected.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
        run: |
          set -euo pipefail

          # Check before writing, so a misconfigured run fails loudly instead
          # of producing a .env full of empty values that Vite happily inlines.
          missing=""
          [ -n "${VITE_SUPABASE_URL:-}" ]      || missing="$missing VITE_SUPABASE_URL"
          [ -n "${VITE_SUPABASE_ANON_KEY:-}" ] || missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secret(s):$missing"
            exit 1
          fi

          {
            printf 'VITE_SUPABASE_URL=%s\n'           "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n'      "$VITE_SUPABASE_ANON_KEY"
            printf 'VITE_STRIPE_PUBLISHABLE_KEY=%s\n' "${VITE_STRIPE_PUBLISHABLE_KEY:-}"
            printf 'VITE_POSTHOG_KEY=%s\n'            "${VITE_POSTHOG_KEY:-}"
            #
            # Mobile-only origins. In the browser an empty VITE_API_BASE_URL
            # means same-origin, which is correct. Inside the Capacitor
            # webview the origin is https://localhost, so an empty value
            # points every /api call at the device itself and silently
            # breaks AI, chat, Stripe and account operations — the app still
            # launches and looks fine.
            #
            # These live in .env.mobile locally, which is gitignored and
            # therefore absent on the runner. They are public URLs, not
            # secrets, so they are written literally here rather than
            # carried as repository secrets.
            printf 'VITE_API_BASE_URL=%s\n'         'https://bonamind.app'
            printf 'VITE_SSE_BASE=%s\n'             'https://bonamind.app'
            printf 'VITE_APP_URL=%s\n'              'https://bonamind.app'
            printf 'VITE_USE_PUTER=%s\n'            'true'
            printf 'VITE_TURNSTILE_SITE_KEY=%s\n'  '0x4AAAAAAAEsHm7dsqEhBi3Nr'
          } > .env

          echo "Wrote .env with $(grep -c '=' .env) entries (values not echoed)."

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle (mobile mode)
        run: npm run build:android

      - name: Generate Android launcher/splash assets
        run: node scripts/generate-android-assets.mjs

      - name: Decode release keystore (from CI secret)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/release.keystore
          chmod 600 android/keystore/release.keystore
          echo "Keystore size: $(stat -c%s android/keystore/release.keystore) bytes"
          echo "Keystore fingerprint (sanity check):"
          keytool -list -v -keystore android/keystore/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | head -20

      - name: Assemble signed release AAB
        env:
          # Monotonic and never reused, so repeat releases are not rejected.
          # run_number alone is NOT enough: GitHub keeps the original run_number
          # when a run is re-run, and Play permanently burns every versionCode it
          # sees, so re-running after a failed upload would be rejected with
          # "version code already used". Folding run_attempt into the low digits
          # makes every attempt a distinct, still-increasing code.
          #
          # Ceiling: Android caps versionCode at 2,100,000,000. run_number would
          # have to reach 2.1 million for this to collide, so it is not a
          # practical limit. Moving the AAB build to a different workflow file
          # WOULD reset run_number to 1 and could collide with an old upload.
          ANDROID_VERSION_CODE: ${{ github.run_number * 1000 + github.run_attempt }}
          ANDROID_KEYSTORE_PATH: android/keystore/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon bundleRelease --stacktrace
          ls -lh app/build/outputs/bundle/release/

      - name: Verify AAB is signed
        run: |
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -E '(SHA1|SHA256):' || true

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-aab
          # Repo-root relative on purpose: defaults.run.working-directory
          # applies to `run:` steps only, never to `uses:` actions, so this
          # needs the bonamind-web/ prefix that the Play upload step below
          # already has.
          path: bonamind-web/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload to Google Play
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.auramind.app
          releaseFiles: bonamind-web/android/app/build/outputs/bundle/release/app-release.aab
          # `track` is deprecated in r0adkll/upload-google-play and prints
          # "'track' is deprecated and will be removed in a future release.
          # Please migrate to 'tracks'". `tracks` is the same option as a list;
          # Play rejects a release that names more than one track, so the list
          # always holds exactly the single value chosen in the input above.
          tracks: ${{ inputs.track || 'internal' }}
          mappingFile: bonamind-web/android/app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: store/android/changelogs
          status: ${{ github.event.inputs.status || 'draft' }}

      - name: Cleanup keystore from runner
        if: always()
        run: |
          rm -f android/keystore/release.keystore
          echo "Keystore removed from runner."
