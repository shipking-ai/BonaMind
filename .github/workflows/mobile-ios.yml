name: Mobile iOS

# Builds the iOS app for the simulator on a GitHub-hosted Mac, launches it in
# an iPhone simulator, and uploads the screenshots plus the app's log.
#
# On the Live Activity: the driver really does run here (probe -> start ->
# update, never ended). Older simulator images reported
# areActivitiesEnabled == false, so ActivityKit refused and CI could only
# verify the *refusal contract* - the driver ran, detected the refusal, and did
# not claim a session it never had. The iOS 26.4.1 image (seen since at least
# 2026-10-09) reports Live Activities enabled, so every run now takes the
# available=true path and must show started=true + updated=true. That proves
# the ActivityKit start/update integration, but not the Dynamic Island or
# lock-screen layout, which only a real device shows. See the live-boot step
# for the gate.
#
# No Apple Developer account or signing is needed for this job. Device/TestFlight
# builds are the separate, manually dispatched `ios-device-ipa` job below.

on:
  pull_request:
    paths:
      - 'bonamind-web/**'
      - 'packages/core/**'
      - '.github/workflows/mobile-ios.yml'
  push:
    branches: [main]
    paths:
      - 'bonamind-web/**'
      - 'packages/core/**'
      - '.github/workflows/mobile-ios.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Live reload: load the web app from this URL instead of the bundle (e.g. https://your-preview.vercel.app or http://192.168.1.20:3000). Leave empty for a normal build.'
        required: false
        default: ''

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 45

    permissions:
      contents: read

    defaults:
      run:
        working-directory: bonamind-web

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: bonamind-web/package-lock.json

      # Same public build values as the Android release. Secrets are absent
      # on Dependabot and fork PRs; the app still builds and boots to its
      # welcome screen with placeholders, which is all this job checks.
      - name: Write build env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          {
            printf 'VITE_SUPABASE_URL=%s\n'           "${VITE_SUPABASE_URL:-https://placeholder.supabase.co}"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n'      "${VITE_SUPABASE_ANON_KEY:-placeholder}"
            printf 'VITE_STRIPE_PUBLISHABLE_KEY=%s\n' "${VITE_STRIPE_PUBLISHABLE_KEY:-}"
            printf 'VITE_API_BASE_URL=%s\n'           'https://bonamind.app'
            printf 'VITE_SSE_BASE=%s\n'               'https://bonamind.app'
            printf 'VITE_APP_URL=%s\n'                'https://bonamind.app'
            printf 'VITE_USE_PUTER=%s\n'              'true'
            printf 'VITE_TURNSTILE_SITE_KEY=%s\n'     '0x4AAAAAAAEsHm7dsqEhBi3Nr'
          } > .env
          echo "Wrote .env with $(grep -c '=' .env) entries (values not echoed)."

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle and sync iOS
        run: npm run build:ios

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | tail -5

      - name: Build for the iOS simulator (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/xcodebuild.log | grep -E "error:|warning: .*BonaListen|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/ios/Build/Products/Debug-iphonesimulator/App.app

      - name: Launch in an iPhone simulator and screenshot
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j \
            | node -e "const d=JSON.parse(require('fs').readFileSync(0)).devices;const all=Object.entries(d).filter(([r])=>r.includes('iOS')).flatMap(([,v])=>v);const p=all.find(x=>/^iPhone \d+ Pro( Max)?$/.test(x.name))||all.find(x=>/^iPhone \d+( Pro)?$/.test(x.name))||all.find(x=>x.name.startsWith('iPhone'));console.log(p.udid)")
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/ios/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.auramind.app
          sleep 25
          mkdir -p ../ios-artifacts
          xcrun simctl io "$DEVICE" screenshot ../ios-artifacts/launch.png
          # Still running 25 s after launch = no crash on start.
          #
          # `launchctl list | grep -q ...` cannot be used under `pipefail`:
          # grep -q exits the instant it matches, the pipe closes, launchctl
          # dies on SIGPIPE (141), and pipefail promotes that to the
          # pipeline's status - so the check reported "App is not running
          # (crashed?)" for an app that was running with a live PID, and
          # wrote its screenshot first. Capture the list, then match on the
          # variable so no pipe is involved.
          APPS=$(xcrun simctl spawn "$DEVICE" launchctl list 2>/dev/null || true)
          if grep -q "com.auramind.app" <<<"$APPS"; then
            echo "App is running."
          else
            echo "::error::App is not running after launch (crashed?)"
            echo "--- launchctl list (last 40) ---"
            tail -n 40 <<<"$APPS"
            echo "-----------------------------"
            xcrun simctl spawn "$DEVICE" log show --last 2m --predicate 'process == "App"' > ../ios-artifacts/app.log || true
            exit 1
          fi
          xcrun simctl spawn "$DEVICE" log show --last 2m --predicate 'process == "App"' > ../ios-artifacts/app.log || true
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      # Same app, built with VITE_IOS_PREVIEW=true: it opens on sample-data
      # screens and walks through them by itself (IOSVisualPreview's tour),
      # so every screen can be photographed without an account or taps.
      - name: Screenshot the iOS tour (sample data)
        run: |
          set -euo pipefail
          echo 'VITE_IOS_PREVIEW=true' >> .env
          npx vite build --mode mobile
          npx cap copy ios
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build > build/xcodebuild-preview.log
          xcrun simctl terminate "$DEVICE" com.auramind.app || true
          xcrun simctl install "$DEVICE" build/ios/Build/Products/Debug-iphonesimulator/App.app
          mkdir -p ../ios-artifacts/screens
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 --force ../ios-artifacts/screens/tour.mp4 &
          REC=$!
          xcrun simctl launch "$DEVICE" com.auramind.app
          # The tour shows a screen every 6 s once the app has loaded (10
          # steps incl. the Live Activity finale); shooting every 3 s catches
          # each one at least once.
          for i in $(seq -w 1 24); do
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "../ios-artifacts/screens/shot-$i.png" >/dev/null
          done
          kill -INT "$REC" || true
          wait "$REC" || true
          # A fixed number of screenshots says nothing about coverage. On the
          # last real run 24 shots contained only 9 distinct frames: the tour
          # stalls on the study screen and the loop keeps re-capturing it, so
          # the artifact looked far broader than it was. Report the real count
          # so the next run cannot quietly regress the same way.
          total=$(find ../ios-artifacts/screens -name 'shot-*.png' | wc -l | tr -d ' ')
          unique=$(md5 -q ../ios-artifacts/screens/shot-*.png | sort -u | wc -l | tr -d ' ')
          echo "tour screenshots: $total captured, $unique distinct frames"
          if [ "$unique" -lt 5 ]; then
            echo "::warning::Only $unique distinct tour frames from $total captures - the tour is likely stalling rather than advancing."
          fi

      # The tour's last step holds a live study session and asks the plugin to
      # start a real ActivityKit session (start + update, never ended).
      #
      # This step does NOT gate. Older simulator images had Live Activities
      # switched off (areActivitiesEnabled == false) and the plugin correctly
      # refused, so the screenshots were the app's own study screen; the iOS
      # 26.4.1 image allows them, so the tour usually starts and updates one
      # now. Either way its timing rides on the tour, and the artifacts are
      # named "attempt" so nobody mistakes them for proof. The contract
      # assertions live in the live-boot step below, which is the one that
      # gates.
      - name: Attempt a Live Activity during the tour (simulator normally refuses)
        run: |
          set -euo pipefail
          xcrun simctl io "$DEVICE" screenshot ../ios-artifacts/screens/liveactivity-attempt-tour.png
          sleep 5
          xcrun simctl io "$DEVICE" screenshot ../ios-artifacts/screens/liveactivity-attempt-tour-after5s.png
          xcrun simctl spawn "$DEVICE" log show --last 10m --predicate 'process == "App"' > ../ios-artifacts/liveactivity-attempt-tour.log || true
          grep "LIVE_ACTIVITY_" ../ios-artifacts/liveactivity-attempt-tour.log || echo "(no Live Activity lines at all — the plugin was never called)"
          # Ground truth that needs no log capture: the driver records every
          # milestone to Preferences. Both web and native prefix keys with
          # `CapacitorStorage.` — reading the bare key always misses.
          #
          # Read the plist inside the app's data container rather than
          # `defaults read <bundle-id>`: the latter resolves against the
          # *host* user domain and returned MISSING for every key, including
          # ones the app had certainly written, which is why this step could
          # not tell "driver never ran" from "we looked in the wrong place".
          PLIST="$(xcrun simctl get_app_container "$DEVICE" com.auramind.app data)/Library/Preferences/com.auramind.app.plist"
          echo "prefs plist: ${PLIST:-<container unavailable>}"
          [ -f "$PLIST" ] && echo "prefs plist exists" || echo "::warning::prefs plist missing"
          read_prefs() { /usr/libexec/PlistBuddy -c "Print :CapacitorStorage.$1" "$PLIST" 2>/dev/null || echo MISSING; }
          for k in session seen device available started updated; do
            echo "driver $k: $(read_prefs bonamind_ci_live_$k)"
          done
          echo "tour: $(read_prefs bonamind_ci_tour_step)"
          started=$(read_prefs bonamind_ci_live_started)
          updated=$(read_prefs bonamind_ci_live_updated)
          session=$(read_prefs bonamind_ci_live_session)
          echo "tour attempt: session=$session available=$(read_prefs bonamind_ci_live_available) started=$started updated=$updated"
          # `session` is a descriptive marker ("session-mounted:<path>"), NOT a
          # boolean - compare by prefix. It is what separates "the tour never
          # reached the study screen" from "the ActivityKit bridge failed".
          case "$session" in
            session-mounted:*) : ;;
            *)
              echo "::error::Live Activity driver never mounted the driven session (session=$session). The attempt screenshots prove nothing."
              exit 1
              ;;
          esac
          if [ "$started" = true ] && [ "$updated" = true ]; then
            echo "Live Activity started and updated during the tour. The live-boot step asserts the contract."
          else
            echo "::warning::Tour-timed Live Activity attempt did not start and update (started=$started updated=$updated). Expected only where the simulator refuses ActivityKit. The live-boot step asserts the contract."
          fi

      # Deterministic attempt without any tour timing: rebuild the web bundle
      # with VITE_IOS_PREVIEW=live so the app boots straight into a driven
      # session (probe + start + update), then assert the plugin's contract.
      # NOTE: dotenv keeps the FIRST of duplicate keys, so the true value
      # from the step above must be replaced, not appended to.
      - name: Live-boot the Live Activity driver and assert its contract
        run: |
          set -euo pipefail
          sed -i '' 's/^VITE_IOS_PREVIEW=.*/VITE_IOS_PREVIEW=live/' .env
          grep -q '^VITE_IOS_PREVIEW=live$' .env
          npx vite build --mode mobile
          npx cap copy ios
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build > build/xcodebuild-liveboot.log
          xcrun simctl terminate "$DEVICE" com.auramind.app || true
          # Uninstall first: installing over the tour build keeps its data
          # container, so every driver key below would start out holding the
          # tour's value. A live-boot driver that stalled before writing
          # `updated` then read as the tour's `true`. A clean container means a
          # key this process never wrote reads MISSING and fails the gate.
          xcrun simctl uninstall "$DEVICE" com.auramind.app || true
          xcrun simctl install "$DEVICE" build/ios/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.auramind.app
          sleep 25
          xcrun simctl io "$DEVICE" screenshot ../ios-artifacts/screens/liveactivity-liveboot.png
          xcrun simctl spawn "$DEVICE" log show --last 10m --predicate 'process == "App"' > ../ios-artifacts/liveactivity-liveboot.log || true
          grep "LIVE_ACTIVITY_" ../ios-artifacts/liveactivity-liveboot.log || echo "(no Live Activity lines at all)"
          # Same container plist as the step above, and the same reason.
          PLIST="$(xcrun simctl get_app_container "$DEVICE" com.auramind.app data)/Library/Preferences/com.auramind.app.plist"
          echo "prefs plist: ${PLIST:-<container unavailable>}"
          [ -f "$PLIST" ] && echo "prefs plist exists" || { echo "::error::prefs plist missing - cannot read driver state"; exit 1; }
          read_prefs() { /usr/libexec/PlistBuddy -c "Print :CapacitorStorage.$1" "$PLIST" 2>/dev/null || echo MISSING; }
          for k in session seen device plugins available started updated; do
            echo "live-boot $k: $(read_prefs bonamind_ci_live_$k)"
          done
          echo "tour: $(read_prefs bonamind_ci_tour_step)"
          plugins=$(read_prefs bonamind_ci_live_plugins)
          available=$(read_prefs bonamind_ci_live_available)
          started=$(read_prefs bonamind_ci_live_started)
          updated=$(read_prefs bonamind_ci_live_updated)
          session=$(read_prefs bonamind_ci_live_session)
          echo "live-boot available: $available | session: $session | started: $started | updated: $updated"

          # Two genuinely different situations, previously reported as one.
          #
          # `available: false` is the OS refusing, not the app failing.
          # BonaLiveActivityPlugin.start() bails on
          # ActivityAuthorizationInfo().areActivitiesEnabled, which reflects the
          # user's Live Activities setting - off on a freshly created simulator.
          # The plugin is behaving correctly, so failing on the refusal itself
          # reported a defect that does not exist.
          #
          # But "the OS refused" was never allowed to mean "nothing was
          # checked". A MISSING plist key took the same exit-0 path as a real
          # refusal, so a driver that never ran at all - or one that crashed
          # before writing anything - went green. Missing is now distinguished
          # from false, and the refusal branch asserts the contract instead of
          # waving the run through.
          if [ "$available" = MISSING ] || [ -z "$available" ]; then
            echo "::error::Driver never reported ActivityKit availability (available=$available). The driver did not run; nothing was proved."
            exit 1
          fi

          # The plugin must be REGISTERED, independently of whether the OS will
          # show an activity.
          #
          # This is the assertion that was missing. `available: false` means two
          # very different things — the user's Live Activities setting is off,
          # or the plugin was never registered because the app built without it
          # — and the driver could not tell them apart, because every call
          # rejected into the same catch. So a build where SceneDelegate
          # discarded MainViewController (where the plugins are registered) and
          # every activity silently did nothing passed this job.
          #
          # Capacitor.isPluginAvailable is synchronous registry truth, so this
          # is answerable on a simulator even though ActivityKit refuses there.
          if [ "$plugins" = MISSING ] || [ -z "$plugins" ]; then
            echo "::error::Driver never recorded plugin registration (plugins=$plugins). Nothing was proved."
            exit 1
          fi
          case "$plugins" in
            *LiveActivity:true*) : ;;
            *)
              echo "::error::BonaLiveActivity is not registered in this build (plugins=$plugins)."
              echo "::error::The app-local plugins are registered in MainViewController.capacitorDidLoad; anything that replaces the storyboard root view controller discards them, and voice study and the Live Activity then fail silently."
              exit 1
              ;;
          esac
          # `session` is a descriptive marker ("session-mounted:<path>"), not a
          # boolean. Its presence is the proof that the driven study screen
          # actually rendered, which is what separates "nothing ran" from
          # "ActivityKit refused".
          case "$session" in
            session-mounted:*) : ;;
            *)
              echo "::error::Live Activity driver never mounted the driven session (session=$session). Nothing was proved."
              exit 1
              ;;
          esac

          if [ "$available" = true ]; then
            # The OS said yes, so anything short of start+update is our bug.
            [ "$started" = true ] || {
              echo "::error::Live Activity enabled but never started on live-boot - this one is a real defect"
              exit 1
            }
            [ "$updated" = true ] || {
              echo "::error::Live Activity started but never updated on live-boot - this one is a real defect"
              exit 1
            }
            echo "Live Activity live-boot started and updated. This is the only path that proves the ActivityKit integration."
          else
            # Contract under refusal, asserted rather than assumed: the driver
            # ran, it detected the refusal, and it did not report a success
            # it never achieved.
            [ "$started" != true ] && [ "$updated" != true ] || {
              echo "::error::OS reports areActivitiesEnabled=$available yet the driver claimed started/updated - it is lying about a session that does not exist"
              exit 1
            }
            echo "::warning::Contract verified under refusal: driver ran, detected areActivitiesEnabled=$available, and correctly reported started=false updated=false. The Live Activity layout itself remains UNPROVEN - only a real device (TestFlight) can show that."
          fi

      - name: Upload screenshot and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator
          path: |
            ios-artifacts
            bonamind-web/build/xcodebuild*.log
          if-no-files-found: ignore

  # An unsigned device build, for putting the app on a real iPhone without a
  # Mac and without an Apple Developer Program membership: download the
  # artifact on Windows and let Sideloadly (or AltStore) sign it with a free
  # Apple ID over USB. Signatures from a free account last 7 days.
  #
  # Two things matter for this app in particular:
  #   - the widget extension rides along inside App.app/PlugIns, so the Live
  #     Activity works; the sideloader must not strip app extensions.
  #   - the Live Activity is requested with pushType: nil, which is what lets
  #     it run under a free "personal team" signature at all: a push token
  #     needs an APNs entitlement that free accounts do not get.
  #
  # `build` rather than `archive`: with signing off, archiving does not
  # reliably place App.app inside the .xcarchive on recent Xcode, so the IPA
  # is packaged by hand from the build products.
  ios-device-ipa:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45

    permissions:
      contents: read

    defaults:
      run:
        working-directory: bonamind-web

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: bonamind-web/package-lock.json

      - name: Write build env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://placeholder.supabase.co}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-placeholder}"
            echo "VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY:-}"
            echo "VITE_API_BASE_URL=https://bonamind.app"
            echo "VITE_SSE_BASE=https://bonamind.app"
            echo "VITE_APP_URL=https://bonamind.app"
            echo "VITE_USE_PUTER=true"
            echo "VITE_TURNSTILE_SITE_KEY=0x4AAAAAAAEsHm7dsqEhBi3Nr"
          } > .env
          echo "Wrote .env with $(grep -c '=' .env) entries (values not echoed)."

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle and sync iOS
        run: npm run build:ios

      # The Expo-Go-shaped trick: point the shell at a URL instead of its own
      # bundled files. Sideload this once and every web change shows up with a
      # pull-to-refresh — only Swift changes need a new IPA after that.
      - name: Load the web app from a live server
        if: inputs.server_url != ''
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const path = "ios/App/App/capacitor.config.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            const url = process.env.SERVER_URL.trim().replace(/\/+$/, "");
            if (!/^https?:\/\//.test(url)) throw new Error("server_url must start with http:// or https://");
            config.server = { ...(config.server || {}), url, cleartext: url.startsWith("http://") };
            fs.writeFileSync(path, JSON.stringify(config, null, 2));
            console.log("Loading the web app from", url);
          '
          # iOS blocks plain HTTP by default, so a LAN dev server needs an
          # exception and the local-network prompt. HTTPS needs neither.
          case "$SERVER_URL" in
            http://*)
              plutil -insert NSAppTransportSecurity -json '{"NSAllowsLocalNetworking": true}' ios/App/App/Info.plist
              plutil -insert NSLocalNetworkUsageDescription \
                -string 'BonaMind loads its development server from your local network.' \
                ios/App/App/Info.plist
              echo "Added a local-network exception for a plain-HTTP dev server."
              ;;
          esac

      - name: Build for a real device (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build/xcodebuild-device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/device/Build/Products/Release-iphoneos/App.app

      - name: Package the IPA
        run: |
          set -euo pipefail
          APP=build/device/Build/Products/Release-iphoneos/App.app
          # The Live Activity is useless if the extension did not come along.
          if [ ! -d "$APP/PlugIns/BonaMindWidgets.appex" ]; then
            echo "::error::widget extension missing from the app bundle"
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry BonaMind-unsigned.ipa Payload
          ls -lh BonaMind-unsigned.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.server_url != '' && 'bonamind-ios-live-reload-ipa' || 'bonamind-ios-unsigned-ipa' }}
          path: bonamind-web/build/BonaMind-unsigned.ipa
          if-no-files-found: error
